name: TzuyangMap Auto Update

on:
  schedule:
    - cron: '17 15 * * *'  # 매일 KST 00:17 (UTC 15:17) — 정시 부하 회피
  workflow_dispatch:        # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # git push 권한

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg 설치 (Whisper 오디오 처리용 — ubuntu-latest엔 보통 있음)
        run: which ffmpeg || sudo apt-get install -y ffmpeg

      - name: 의존성 설치
        run: pip install yt-dlp youtube-comment-downloader youtube-transcript-api faster-whisper

      - name: 자동 업데이트 실행
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_JAVASCRIPT_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
        run: python scripts/auto_update.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "tzuyangmap-bot"
          git config user.email "bot@tzuyangmap.com"
          git add public/data/restaurants_geo.json
          git diff --staged --quiet || git commit -m "새 맛집 자동 추가 $(date '+%Y-%m-%d')"
          git pull --rebase origin master
          git push
