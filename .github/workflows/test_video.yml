name: Test Single Video Extraction

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'YouTube video ID (e.g. xFGP21Xmn2w)'
        required: true
        type: string
        default: 'xFGP21Xmn2w'
      title:
        description: '영상 제목 (선택 — oEmbed 실패 시 사용)'
        required: false
        type: string
        default: '엽떡 먹고싶어지는 영상'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yt-dlp youtube-comment-downloader youtube-transcript-api

      - name: Run extraction test
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_JAVASCRIPT_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
        run: python scripts/test_one_video.py "${{ inputs.video_id }}" "${{ inputs.title }}"
